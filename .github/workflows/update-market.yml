# .github/workflows/update-market.yml
# ------------------------------------
# Records the daily CLOSE into market-history.json, and nothing else.
#
# ---------------------------------------------------------------------------
# WHY THIS IS NOW SO SMALL (it used to loop all day — read before expanding it)
# ---------------------------------------------------------------------------
# This workflow used to hold a runner for three hours and refresh every 15
# minutes, because GitHub's scheduler could not be trusted to fire on time and
# the board had no other source of live data.
#
# It has one now: a Cloudflare Worker (desk-quotes) that builds the same payload
# on demand, so the page is current the moment you open it with no schedule
# involved at all.
#
# Keeping the loop after that was actively harmful. Both systems authenticate
# with the SAME Finnhub key against the same free-tier limits. While the loop
# was running, the Worker's pulls came back partial — 11 of 22 symbols, the rest
# 429 — because the two were competing for one quota. Cancel the loop, wait two
# minutes, and the Worker returned 22 of 22 with zero failures. That is the
# whole reason this file shrank.
#
# So there is exactly one consumer during market hours: the Worker.
#
# What is left here is the one job the Worker genuinely cannot do. The Worker is
# stateless — it cannot accumulate a rolling history — so it reads
# market-history.json, which something has to write once a day after the bell.
# That job is a perfect fit for GitHub's unreliable scheduler, because it is not
# time-critical: a close recorded at 8pm is still the right close.
#
# fetch-market.js only appends to history when it decides session === 'close'
# (after 4:00pm ET by the real ET clock), so a stray early firing updates
# market-data.json and correctly leaves the history alone.
#
# DO NOT add intraday crons back. If the board looks stale during the day, the
# problem is the Worker, not this file — check desk-quotes and look at the
# `diagnostics` block in its response.

name: Update market data

on:
  schedule:
    # Cron is UTC and does not follow US daylight saving, so both slots exist to
    # cover either regime. Whichever lands first records the close; the second
    # is a harmless no-op because the data will not have changed.
    - cron: '15 20 * * 1-5'   # 4:15p EDT
    - cron: '15 21 * * 1-5'   # 4:15p EST  (5:15p EDT)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-market
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        # full history so the reset dance below is safe

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Record the close
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: |
          set -uo pipefail
          echo "Running at $(TZ=America/New_York date '+%Y-%m-%d %H:%M') ET"

          git config user.name "market-bot"
          git config user.email "actions@github.com"

          if ! node fetch-market.js; then
            echo "::error::fetch-market.js failed"
            exit 1
          fi

          if git diff --quiet -- market-data.json market-history.json; then
            echo "Nothing changed."
            exit 0
          fi

          # main may have moved since checkout. Rather than merge, park our two
          # generated files outside the tree, hard-reset onto main as it is right
          # now, drop them back on top and commit that. Our data is always the
          # last word on these two files, so a conflict is impossible.
          mkdir -p "$RUNNER_TEMP/market"
          cp market-data.json market-history.json "$RUNNER_TEMP/market/"

          for attempt in 1 2 3 4 5; do
            git fetch --quiet origin main
            git reset --quiet --hard origin/main
            cp "$RUNNER_TEMP/market/market-data.json" \
               "$RUNNER_TEMP/market/market-history.json" .
            git add market-data.json market-history.json

            if git diff --staged --quiet; then
              echo "Remote already has this data."
              exit 0
            fi

            git commit --quiet -m "Record close ($(TZ=America/New_York date '+%Y-%m-%d %H:%M') ET)"

            if git push --quiet origin HEAD:main; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi

            echo "Push rejected on attempt $attempt — main moved, retrying."
            sleep $(( attempt * 3 ))
          done

          echo "::error::Could not push after 5 attempts."
          exit 1
